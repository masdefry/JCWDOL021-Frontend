<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="position.css"
    />
  </head>
  <body>
    <!-- 
        RELATIVE
        - Position yang relatif terhadap posisi semula
        - Ketika elemen relatif berpindah dari posisi semula, akan meninggalkan celah
        - Bisa menggunakan property top, right, bottom, left
    -->

    <div id="container-01">
      <div>Box-01</div>
      <div id="box-02">Box-02</div>
      <div>Box-03</div>
    </div>

    <!-- 
        ABSOLUTE
        - Diposisikan relatif terhadap elemen parent nya yang memiliki potition non-static
        - Jika tidak ada elemen parent yang memiliki position non-static, maka by default dia akan relatif terhadap body
        - Ketika elemen absolute bergeser, maka tidak akan meninggalkan celah
    -->
    <div id="container-02">
      <div>Box-01</div>
      <div id="box-02">Box-02</div>
      <div>Box-03</div>
    </div>

    <!-- 
        FIXED
        - Diposisikan relatif terhadap body/viewport
        - Tidak akan bergeser meskipun halaman sedang di scroll
        - Navbar/Sidebar/Footer
    -->
    <div id="container-03"></div>

    <!-- 
        STICKY
        - Posisinya relatif terhadap scroll user
    -->
    <div id="container-04">

    </div>
